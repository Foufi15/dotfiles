# ==============================================================================

# Remplace Ctrl+b par Ctrl+d
unbind C-b
set -g prefix C-d

# Ctrl+d puis Ctrl+d envoie un vrai Ctrl+d au programme
bind C-d send-prefix


# ==============================================================================
# TERMINAL / iTerm2 / YAZI
# ==============================================================================

# Terminal utilisé à l'intérieur de tmux
# set -g default-terminal "tmux-256color"

# Nécessaire pour permettre aux images Yazi de traverser tmux
set -g allow-passthrough on

# Conserve les informations du terminal hôte
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Événements de focus
set -g focus-events on


# ==============================================================================
# CLAUDE CODE / TOUCHES ÉTENDUES
# ==============================================================================

# Permet notamment de différencier Entrée et Shift+Entrée
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'


# ==============================================================================
# OPTIONS GÉNÉRALES
# ==============================================================================

set -g mouse on
setw -g mode-keys vi

# Barre de statut en haut
set -g status-position top

# Commence les fenêtres et panneaux à 1
set -g base-index 1
setw -g pane-base-index 1

# Renumérote automatiquement les fenêtres après fermeture
set -g renumber-windows on

# Réduit légèrement le délai des raccourcis clavier
set -sg escape-time 10


# ==============================================================================
# RECHARGEMENT DE LA CONFIGURATION
# ==============================================================================

unbind r

bind r source-file ~/.config/tmux/tmux.conf \
    \; display-message "Configuration tmux rechargée"


# ==============================================================================
# NAVIGATION ENTRE LES SPLITS
# ==============================================================================

# Navigation sans préfixe avec Ctrl+h/j/k/l
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R


# ==============================================================================
# REDIMENSIONNEMENT DES SPLITS
# ==============================================================================

# Préfixe + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# ==============================================================================
# NAVIGATION ENTRE LES FENÊTRES
# ==============================================================================

# Préfixe + n : fenêtre suivante
bind n next-window

# Préfixe + p : fenêtre précédente
bind p previous-window

# Préfixe + Tab : dernière fenêtre utilisée
bind Tab last-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'christoomey/vim-tmux-navigator'


# ==============================================================================
# MODE COPIE
# ==============================================================================

# Préfixe + Échap pour entrer en mode copie
bind Escape copy-mode

# v commence la sélection
bind -T copy-mode-vi v send-keys -X begin-selection

# Presse-papiers système : pbcopy (macOS), wl-copy (Wayland) ou xclip (X11)
if-shell 'command -v xclip' \
    'set -s copy-command "xclip -selection clipboard -in"'
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy' \
    'set -s copy-command "wl-copy"'
if-shell 'command -v pbcopy' \
    'set -s copy-command "pbcopy"'

# y copie dans le presse-papiers
bind -T copy-mode-vi y \
    send-keys -X copy-pipe-and-cancel

# Copie automatique à la fin d'une sélection à la souris
bind -T copy-mode-vi MouseDragEnd1Pane \
    send-keys -X copy-pipe-and-cancel


# ==============================================================================
# POPUP
# ==============================================================================

# Préfixe + t : ouvre un terminal flottant
bind-key t display-popup \
    -w 80% \
    -h 80% \
    -d "#{pane_current_path}" \
    -E

run '~/.config/tmux/plugins/tpm/tpm'
